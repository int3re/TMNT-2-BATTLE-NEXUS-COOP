; tmnt2net — настройки мода для TMNT 2: Battle Nexus (лежит рядом с TMNT2.exe)
; Почти всё это есть в игре, с подсказкой к каждой настройке: экран и картинка — ОПЦИИ → ЭКРАН,
; геймпады, клавиатура, игра в фоне и заставки — главное меню → НАСТРОЙКИ МОДА.
; Изменения в этом файле применяются при следующем запуске игры.

[video]
; заставки при запуске: show — логотипы и вступительный ролик идут как в оригинале, любая клавиша,
; щелчок мыши или кнопка геймпада пропускает их; skip — игра всегда сразу открывается в главном меню
intro = show
; borderless — окно без рамки на весь монитор (разрешение рабочего стола не меняется)
; windowed   — обычное окно с рамкой
; (полноэкранного режима «как в оригинале» нет с 0.17.0: в нём игра встаёт, пока её окно не активно, и
;  сетевая игра у всех ждёт; fullscreen читается как borderless)
mode = borderless
; auto — само: без рамки = монитор, в окне = размер окна
; 1920x1080 — своё разрешение кадра (в окне и без рамки не больше рабочего стола); game — из TMNT2.ini
; (в игре: ОПЦИИ → ЭКРАН → РАЗРЕШЕНИЕ, меняется сразу)
resolution = auto
; auto — широкий экран: обзор шире (Hor+), меню, интерфейс и ролики в центре 4:3, без растяжения
; 4:3 — кадр 4:3 с чёрными полями
; stretch — тот же кадр 4:3, растянутый на весь экран
; (камера игры при любом значении одна и та же — так нужно для сетевой игры; меняется только форма кадра)
aspect = auto
; center — меню и интерфейс в центре 4:3; stretch — растянуть их на всю ширину (только для aspect = auto)
hud = center
; карта мира при hud = center: wide — её картинка продолжается до краёв широкого экрана;
; center — картинка в середине 4:3, по бокам чёрные поля
map = wide
; шкалы в уровне (круг здоровья, таблички игроков) при hud = center: corners — по углам кадра,
; center — в углах середины 4:3, как остальной интерфейс
gauges = corners
; размер круга здоровья и табличек игроков в уровне, в процентах: 100 (как в игре), 85, 70
gauges_size = 100
; камера в уровне в сетевой игре: 1 — у каждого своя, следит за его героем; 0 — одна на всех, как в игре
; (логика игры у всех одна и та же в любом случае: своя камера только рисует)
own_camera = 1
; приближение камеры уровня колесом мыши (0.5 ближе … 2.5 дальше), средняя кнопка — 1.0; запоминается само
camera_zoom = 1.0
; обзор камеры (широкий угол): 1.0 как в игре, больше — шире (0.5 … 2.0). В сетевой игре тоже: там он
; меняет только картинку на вашем ПК (логика игры у всех считает 1.0)
fov = 1.0
; сглаживание краёв (MSAA): 0 — выкл, 2, 4, 8. Работает, когда кадр заполняет окно (без рамки на весь
; экран или окно без масштабирования)
antialiasing = 4
; анизотропная фильтрация текстур (пол и стены под углом чётче): 0 — выкл, 2 … 16
anisotropy = 16
; резкость готового кадра: 0 — выкл … 100 (лучше видны текстуры и мелкие детали, без ореолов)
sharpen = 50
; цвета: 0 — как в игре … 100 (сочнее, чуть больше контраста)
colors = 25
; размер окна (только для windowed): auto = 3/4 высоты рабочего стола, или например 1280x720
window_size = auto
; окно можно тянуть мышью (пропорции сохраняются)
window_resize = 1
; вертикальная синхронизация: -1 как в игре, 0 выкл, 1 вкл
vsync = -1
; кадров в секунду; логика игры идёт по кадрам, 60 = родная скорость (0 = как в оригинале, ~57)
fps_limit = 60
; pause — игра ждёт, пока окно не в фокусе (как в оригинале); run — продолжает работать
background = pause
; прятать курсор мыши над игрой
hide_cursor = 1

[input]
; геймпады Xbox, PlayStation (DualShock 4, DualSense), Switch Pro и другие через SDL:
; сколько геймпадов показать игре (0..4). 0 — как в оригинале (только DirectInput, Xbox-кнопки перепутаны)
pads = 4
; 2 — двое за одной клавиатурой: каждая половина становится отдельным «геймпадом»
;   левая:  WASD — ходить, F — атака, G — атака 2, Space — прыжок, R — сюрикен, Q — рывок, E — блок,
;           LShift — смена героя, C — R2, ` — Select, Tab — Start, Z/X — L3/R3
;   правая: стрелки — ходить, Num1 — атака, Num2 — атака 2, Num0 — прыжок, Num5 — сюрикен,
;           Num4 — рывок, Num6 — блок, Num3 — смена героя, Num. — R2, Num- — Select, Num Enter — Start
;   Enter и Esc остаются у обычной клавиатуры игры (меню).
; 1 — клавиатура как в оригинале
keyboard_players = 1
; Клавиши клавиатуры и кнопки мыши меняются в игре: ОПЦИИ → УПРАВЛЕНИЕ (выбрать действие, нажать ВВОД,
; затем клавишу или кнопку мыши) или одной строкой: главное меню → НАСТРОЙКИ МОДА → КЛАВИШИ И МЫШЬ
; (wasd + мышь: атака — ЛКМ, сильная атака — ПКМ). Мод сам записывает их сюда строкой keys = ...
; (13 кодов: атака, сильная атака, сюрикен, прыжок, подкат, блок, смена героя, камера, информация,
; вверх, вниз, влево, вправо; 240 — ЛКМ, 241 — ПКМ, 243 и 244 — боковые кнопки мыши).

[net]
; Сетевая игра до 4 игроков. У каждого своя копия игры и свой экран, по сети идёт только ввод.
; Сессия начинается с самого начала игры: игра ждёт на чёрном экране, пока все соберутся.
; off  — без сети
; menu — при запуске меню: 1 создать игру, 2 войти через Steam, 3 войти по коду / IP, Esc — одному
; host — сразу создать игру; join — сразу войти (куда — в join)
mode = off
; join: steam (игра друга в Steam), код TMNT-XXXX-XXX или IP[:порт] (LAN / интернет), SteamID64 хоста
join = steam
; auto — Steam, если он запущен (лобби для друзей), и LAN / IP всегда; steam | enet
transport = auto
; имя для других игроков (по умолчанию имя в Steam или имя компьютера)
name =
; порт для LAN / IP (хосту в интернете его надо пробросить; через Steam не нужно)
port = 7790
; задержка ввода в кадрах в начале сессии (её задаёт хост): auto — по пингу (2..10). Дальше каждый игрок
; сам подстраивает свою задержку под свою связь, от этого значения до 12 кадров
input_delay = auto
; лобби хоста в Steam: friends — только друзья, public — все
lobby_type = friends
; игрок, который молчит дольше (мс), выбывает; его черепаха остаётся без управления, пока он не войдёт
; снова (тогда он на своём месте: хост узнаёт его по Steam ID или по player_id, ник может быть другим)
timeout_ms = 8000
; 1 — пока игра идёт без сети, принятое приглашение Steam (или «Присоединиться к игре» у друга)
; перезапускает её в сетевую игру к другу; Steam при этом включён (статус «Spacewar»). 0 — выкл.
steam_invites = 1
; 1 — в сетевой игре кадр под форму вашего монитора (21:9, 16:10 — без полос) и ваш fov; логика игры у всех
; считает одну камеру 16:9. 0 — у всех 16:9 с полосами, как раньше
wide = 1

[fixes]
; исправление «Unkown Error» при запуске (ошибка игры с числом геймпадов)
gamepad_snapshot = 1
; игра не падает, если во время загрузки окно не в фокусе (Alt+Tab)
keyboard_focus = 1
; все разрешения монитора в меню игры (в оригинале только 640x480, 800x600, 1024x768)
all_modes = 1
; Esc — назад в меню игры (как пробел)
esc_back = 1

[log]
; tmnt2net.log рядом с игрой: error | warn | info | debug
level = info
; ошибки в коде игры записываются в лог
exceptions = 1

[debug]
; разрешить вторую копию игры (для проверки сетевой игры на одном ПК)
multi_instance = 0
; проверка сетевой игры: одинаковый ввод -> одинаковая игра (tmnt2net-sim.log по строке на кадр);
; record = файл: записать ввод каждого кадра; replay = файл: повторить запись
determinism = 0
